services:

  web:
    build: .
    container_name: music_web
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - .:/app
    expose:
      - "8000"
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:1.27-alpine
    container_name: music_nginx
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web

  postgres:
    image: postgres:17
    container_name: music_postgres
    environment:
      POSTGRES_DB: Song_Discovery
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ashok@2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: music_redis
    ports:
      - "6379:6379"

  celery:
    build: .
    container_name: music_celery
    command: celery -A config worker -l info
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis

  celery-beat:
    build: .
    container_name: music_celery_beat
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data: