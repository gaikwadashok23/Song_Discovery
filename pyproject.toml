[project]
name = "song-recommendation-app"
version = "0.1.0"
description = "Song recommendation application"
readme = "README.md"
authors = [
    { name = "Swaroop", email = "swaroopshinde02@gmail.com" }
]
requires-python = ">=3.12"

dependencies = [
    "django>=6.1.1",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.1",
    "djangorestframework-simplejwt>=5.5.1",
    "psycopg[binary]>=3.3.6",
    "celery>=5.5.0",
    "redis>=6.0.0",
    "django-redis>=6.0.0",
    "django-celery-beat>=2.1.0",
    "python-dotenv>=1.2.3",
    "pytz>=2026.4",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "gunicorn>=26.2.0",
]

[project.scripts]
song-recommendation-app = "song_recommendation_app:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"
